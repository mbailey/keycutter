# SSH ControlMaster Configuration
#
# ControlMaster multiplexes SSH connections, reusing existing connections
# for subsequent commands to the same host. This is especially useful with
# FIDO2/YubiKey SSH keys - the first connection requires a touch, but
# subsequent connections reuse the master socket without additional touches.
#
# Benefits:
# - Fewer YubiKey touches for batch operations (e.g., git sync across repos)
# - Faster connection establishment for repeated connections
# - Reduced latency for interactive workflows
#
# Security Considerations:
# - Socket is protected by Unix permissions (user-only access)
# - If something runs as your user, it could hijack authenticated sessions
#   during the ControlPersist window
# - FIDO2 keys cannot be stolen - only active sessions can be piggybacked
# - Trade-off: convenience vs. session reuse window exposure
#
# This block ships OFF by default (fully commented out, matching upstream).
# To enable it, uncomment the block between the >>> / <<< markers below and
# add your own hostnames to the Host line. The github patterns are safe
# defaults; the others are an example you should replace.

##########################################################################
# GitHub + personal machines  (OPT-IN)
##########################################################################
# Reduces YubiKey touches when running multiple git operations or repeated
# SSH commands to your own machines.
#
# Replace `laptop desktop homeserver` with your actual personal hostnames.
#
# ControlPath uses %n (the alias exactly as typed, e.g. github.com_work) and
# NOT %h (the resolved HostName). keycutter collapses every github.com_* alias
# to `HostName github.com`, so a %h-based path would resolve all of them to one
# shared master socket — letting one GitHub identity ride another's
# authenticated session. %n keeps one socket per identity.
#
# To enable: uncomment the six lines between the markers (strip the leading
# "# ").
#
# >>> keycutter controlmaster (opt-in) >>>
# Host github.com github.com_* laptop desktop homeserver
#   ControlMaster auto
#   ControlPath ~/.ssh/keycutter/controlmaster/sockets/%r@%n:%p
#   ControlPersist 5m
#   ServerAliveInterval 10
#   ServerAliveCountMax 3
# <<< keycutter controlmaster (opt-in) <<<

##########################################################################
# Default: Disable ControlMaster for all other hosts
##########################################################################
# Uncomment to explicitly disable ControlMaster globally, with exceptions
# above.
#
# Host *
#   ControlMaster no
