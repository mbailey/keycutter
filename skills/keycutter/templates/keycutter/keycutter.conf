# Keycutter SSH Config - https://github.com/mbailey/keycutter (branch skill)

# SSH Config for improved SSH Key security supporting:
#
# - SSH Keytags naming convention: e.g. github.com_alice@work
# - SSH Key Privacy: Define which keys to offer to remote hosts.
# - Support for multiple service accounts (e.g. GitHub.com)
#
# Curated slice of upstream keycutter (see references/deferred-features.md):
# - SSH Agent Profiles: retired -- superseded by native destination-constrained
#   agent keys (ssh-add -h); see references/constrained-forwarding.md
# - SSH over SSM: dropped from the minimal skill

# Load feature-specific config (each feature directory owns its own *.conf):
# - hosts/         — host-specific Host blocks (personal, work, etc.)
# - controlmaster/ — SSH connection multiplexing
# Hidden files (starting with '.') are automatically excluded by SSH.
Include keycutter/hosts/*.conf
Include keycutter/controlmaster/*.conf

# GitHub's alias suffix (github.com_<user>) doesn't exist in DNS -- this
# stanza is what makes it resolve. Load-bearing: without it, multi-account
# routing (the flagship feature) breaks.
Host github.com*
  HostName github.com # Enable GitHub CLI to find a known host.

Host *github.com*
  User git
  ForwardAgent no    # GitHub doesn't need access to your ssh-agent.
  IdentitiesOnly yes # Don't expose random public keys to GitHub.com.
  RequestTTY no      # GitHub does not (intentionally) provide shell access.
  # GitHub's solution to firewalls blocking SSH port 22
  # HostName ssh.github.com
  # Port 443

# Sourcehut alias suffix -- same reasoning as the GitHub stanza above.
Host git.sr.ht*
  HostName git.sr.ht

Host *git.sr.ht*
  User git
  ForwardAgent no    # Sourcehut doesn't need access to your ssh-agent.
  IdentitiesOnly yes # Don't expose random public keys to Sourcehut.
  RequestTTY no      # Sourcehut does not provide shell access.

# Set some defaults for all connections
Host *
  # Keytag key selection -- zero exec (verified against OpenSSH 10.3p1).
  # ssh natively skips a missing IdentityFile, so this one static token
  # line offers <alias>@<local-hostname> if the key exists, and is a
  # silent no-op otherwise. %n = the Host alias as typed (e.g.
  # github.com_alice), %L = local hostname short form.
  #
  # Cost (i): this suppresses the default ~/.ssh/id_* fallback on every
  # host (IdentitiesOnly below) -- a legacy key not renamed into the
  # keytag convention won't be offered until it gets an explicit
  # IdentityFile line. Zero cost on an all-keycutter machine.
  # Cost (ii): the device label must equal `hostname -s` -- dynamic
  # KEYCUTTER_ORIGIN aliasing doesn't survive here. Custom device labels
  # or legacy default-named keys use a static per-host stanza instead
  # (see references/ssh-config-explained.md).
  IdentityFile ~/.ssh/keycutter/keys/%n@%L
  IdentitiesOnly yes # Don't offer all public keys to remote hosts.
  ForwardAgent no    # Don't offer SSH agent forwarding to all remote hosts.
  SendEnv KEYCUTTER_ORIGIN
  # Secure Enclave (macOS): the origin names the authenticator. On a Mac
  # whose KEYCUTTER_ORIGIN is its host name (the default), `keycutter
  # install` UNCOMMENTS the next line, so every -sk key on this machine
  # signs through Apple's provider (Touch ID). Whole machine, not per key:
  # ssh picks the provider per host, not per key. Cost: a YubiKey stops
  # signing on this Mac. Any other origin (e.g. <host>-yk), or not a Mac,
  # and it stays a comment. Decided at install: re-run it after changing
  # the origin.
  # SecurityKeyProvider /usr/lib/ssh-keychain.dylib

# vim:ft=sshconfig
